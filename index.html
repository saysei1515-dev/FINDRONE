<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINDRONE Gemini Object Detection</title>
  <!-- PeerJSのCDN -->
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- アプリのUI本体（既存のレイアウト構造に合わせてお使いください） -->
  <div class="container">
    <h1>FINDRONE - AI 探索カメラ</h1>
    <div id="status" style="color: #00ff00; font-weight: bold;">ステータス: 初期化中...</div>
    
    <!-- カメラ映像とキャンバスの重ね合わせ領域 -->
    <div class="video-container" style="position: relative; display: inline-block;">
      <video id="video" autoplay playsinline style="width: 100%; max-width: 600px; display: block;"></video>
      <canvas id="outputCanvas" style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
    </div>

    <!-- コントロール群 -->
    <div class="controls">
      <input type="text" id="pcIdInput" placeholder="PCの接続IDを入力">
      <button onclick="connectToPC()">PCに接続</button>
      <br><br>
      <input type="text" id="targetObject" placeholder="探すもの（例：赤い鞄、男の人）" value="赤い財布">
      <button onclick="updateTarget()">ターゲット更新</button>
      <br><br>
      <button id="startButton" onclick="startCamera()" disabled>遠隔カメラ起動 & 探索スタート</button>
      <button id="stopButton" onclick="stopCamera()" style="display:none;">探索停止</button>
    </div>

    <!-- 検出履歴ギャラリー -->
    <div id="imageGallery" style="display: flex; gap: 10px; overflow-x: auto; margin-top: 20px;"></div>
  </div>

  <!-- プレビューモーダル -->
  <div id="imagePreviewModal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center;" onclick="closePreview()">
    <img id="previewImage" style="max-width:90%; max-height:90%; border-radius:8px;">
  </div>

  <!-- スクリプトの読み込み（type="module" は不要です） -->
  <script src="app.js"></script>
</body>
</html>
